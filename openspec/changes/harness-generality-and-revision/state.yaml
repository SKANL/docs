notes: >
  Harness generality + semantic revision. Six bound decisions (A-F):
  (A) template-driven review rules — move rule DATA out of rules.py/
  source_role.py into template config, estadia declares current values so
  behavior is byte-identical (pure refactor); (B) native `doc revise` loop —
  agent edits section .md, harness provides diff + scoped re-validation +
  provenance, v1 covers prose + rippling context-topic edits, defers
  structural/re-ingest; (C) HTML (deterministic) + PDF (best-effort,
  WARN+skip) renderers via DocumentRendererPort, PDF explicitly
  non-byte-deterministic (reproducibility-boundary amendment); (D) 2nd
  built-in non-APA English SRS-like template + e2e acceptance validating A;
  (E) verify-phase clean-room refinement of AGENTS.md; (F) lightweight
  lifecycle (draft/final) + build version surfaced by `doc status`.
  Non-negotiable: estadia backward-compat, strict TDD RED-first, determinism
  for docx/HTML. 7 chained slices (mechanical/low-risk first). Does NOT touch
  the active universal-schema-harness change.
