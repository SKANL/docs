name: Prepare release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to prepare
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-prepare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.7.0
        with:
          version: '0.12.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Create release manifest
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          printf 'ready-to-publish\nref=%s\n' '${{ inputs.ref }}' > dist/RELEASE-STATUS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.ref }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
