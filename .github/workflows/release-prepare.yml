name: Prepare release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to prepare
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.7.0
        with:
          version: '0.12.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Create release manifest
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          printf 'ready-to-publish\nref=%s\n' '${{ inputs.ref }}' > dist/RELEASE-STATUS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.ref }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
