name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Green on the day you pushed says nothing about today. This project is
  # used in bursts -- four work sessions across 25 days, measured from its
  # own run log -- so months can pass with nothing exercising the gates while
  # pandoc, the Python dependencies and the runner image all move underneath.
  # A weekly run is what turns "the tests passed last time I pushed" into
  # "the tests pass now".
  schedule:
    - cron: "0 6 * * 1"
  # And a button, for when you want to know before the week is out.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pandoc is an OPTIONAL toolchain at runtime, but 11 integration tests
      # skipif it away. Installing it here turns those skips into real
      # coverage of the ingest/render paths — the whole point of having CI
      # rather than trusting a developer laptop's tool set.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # Lint and typecheck run BEFORE the 5-minute suite: they fail in
      # seconds, so a formatting or typing regression never costs a full
      # test run to discover.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (mypy)
        run: uv run mypy

      # --cov-fail-under is a RATCHET, not a target. It sits just under the
      # measured 96% so an accidental drop fails loudly, while a deliberate
      # one is a visible edit to this line.
      - name: Tests
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-fail-under=93

  # The hexagonal layering rule needs a GitNexus index, so it gets its own
  # job: installing and indexing costs ~75s, and running it in parallel keeps
  # it off the critical path. `ARCHITECTURE_REQUIRE_GRAPH` turns a missing
  # index from a skip into a failure — without it this job could pass by
  # enforcing nothing, which is the exact failure mode the flag exists for.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitNexus
        run: npm install -g gitnexus

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # --pdg is what carries the control/data-dependence layers; --index-only
      # keeps it from rewriting CLAUDE.md/AGENTS.md in the checkout.
      - name: Index the repository
        run: gitnexus analyze --index-only --pdg

      - name: Architecture invariants
        env:
          ARCHITECTURE_REQUIRE_GRAPH: "1"
        run: uv run pytest tests/architecture -q

  # Measured: `check` runs 1575 tests and skips 16, while a developer laptop
  # runs 1584 and skips 7. The gate had a SMALLER surface than the desk it
  # guards -- and the nine-test difference is precisely the optional
  # toolchains: mermaid diagrams, SVG rasterisation, Java-backed PDF ingest.
  # The seven LibreOffice tests (PDF output, visual QA) were exercised by
  # nobody, anywhere.
  #
  # Its own job, in parallel: installing LibreOffice and Chromium is minutes
  # of setup that must not delay lint and typecheck, which fail in seconds.
  toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ubuntu 24.04 runners disable unprivileged user namespaces via AppArmor,
      # and Chromium (which mermaid-cli drives through puppeteer) cannot start
      # without them. Fixed in the RUNNER, never in the harness: `mmdc` is
      # invoked by the product, and teaching it a `--no-sandbox` knob would put
      # a CI workaround into everyone's diagram rendering.
      - name: Allow unprivileged user namespaces (Chromium sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the optional toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pandoc libreoffice-writer default-jre-headless
          npm install -g @mermaid-js/mermaid-cli
          curl -sSL -o /tmp/resvg.tar.gz             https://github.com/linebender/resvg/releases/download/v0.45.1/resvg-linux-x86_64.tar.gz
          sudo tar -xzf /tmp/resvg.tar.gz -C /usr/local/bin resvg
          sudo chmod +x /usr/local/bin/resvg

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # Prints the version of every toolchain it found -- the same report a
      # user gets, and the log line that explains a later behaviour change.
      - name: Report what is actually available
        run: uv run python -m docs.cli.main doctor || true

      # `tests/architecture` is deliberately excluded: it needs a GitNexus
      # index, the `architecture` job owns it, and its three skips here would
      # muddy the zero-skip assertion below.
      - name: Tests with the full toolchain
        run: |
          uv run pytest tests/unit tests/integration -q -rs 2>&1 | tee /tmp/out.txt

      # What this job exists to defend: with every toolchain installed, NO test
      # may skip FOR WANT OF A TOOL. A toolchain that silently stops
      # installing would otherwise turn the suite green by skipping, which is
      # exactly the failure mode this job was added to end.
      #
      # Not "zero skips": a couple of tests require LibreOffice to be ABSENT,
      # because they pin the degradation path. Those are expected here and are
      # covered the other way round by `check`, which has no LibreOffice.
      # Between the two jobs both directions run.
      - name: Fail if the toolchain coverage regressed
        run: |
          missing=$(grep -E '^SKIPPED' /tmp/out.txt | grep -Ei 'not installed|not on PATH|not available' || true)
          if [ -n "$missing" ]; then
            echo "::error::a toolchain went missing -- these tests skipped for want of a tool:"
            echo "$missing"
            exit 1
          fi
          echo "no test skipped for want of a tool"
          grep -E '^SKIPPED' /tmp/out.txt || echo "(no skips at all)"
