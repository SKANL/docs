name: Architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
      - run: npm install --global gitnexus@1.6.12
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.7.0
        with:
          version: '0.12.14'
          enable-cache: true
      - run: uv sync --locked
      - run: gitnexus analyze --index-only --pdg
      - env:
          ARCHITECTURE_REQUIRE_GRAPH: '1'
        run: uv run pytest tests/architecture -q
