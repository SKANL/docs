name: Architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - run: npm install --global gitnexus@1.6.12
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.7.0
        with:
          version: '0.12.14'
          enable-cache: true
      - run: uv sync --locked
      - run: gitnexus analyze --index-only --pdg
      - env:
          ARCHITECTURE_REQUIRE_GRAPH: '1'
        run: uv run pytest tests/architecture -q
