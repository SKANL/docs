name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.7.0
        with:
          version: '0.12.14'
          enable-cache: true
      - name: Install the required Pandoc toolchain
        run: |
          curl --fail --location --silent --show-error -o /tmp/pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-linux-amd64.tar.gz
          echo 'c573fc25bc0880879bfff9a929a2a9c6834a6c5e4d7d1669fb23eddeaef37937  /tmp/pandoc.tar.gz' | sha256sum --check
          sudo tar -xzf /tmp/pandoc.tar.gz --strip-components=1 -C /usr/local pandoc-3.1.11/bin/pandoc
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src tools
      - name: Tests and coverage
        run: uv run pytest -q --junitxml=junit.xml --cov=src --cov-report=xml:coverage.xml --cov-report=html:coverage-html --cov-report=term --cov-fail-under=86
      - name: Differential coverage
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.run_id }}
          path: |
            coverage.xml
            coverage-html/
            junit.xml
          if-no-files-found: error
          retention-days: 14
