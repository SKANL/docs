name: Release Review Studio Desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.7.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      - name: Build signed desktop bundles
        working-directory: desktop
        run: npm run build:windows
      - name: Validate clean installer and sidecar
        working-directory: desktop
        run: npm run test:installer
      - name: Generate updater manifest
        working-directory: desktop
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $base = "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $msi -or -not $nsis) { throw "Tauri bundles were not found" }
          python scripts/generate-update-manifest.py --version $version --base-url $base `
            --msi $msi.FullName `
            --nsis $nsis.FullName `
            --output latest.json
      - name: Publish signed release
        uses: softprops/action-gh-release@4d8ab33c14495378882c8fef6babbed32e187639 # master
        with:
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop/latest.json
