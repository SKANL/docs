name: Reusable Python setup

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
    outputs:
      python-version:
        value: '3.11'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.7.0
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run python -V && uv --version
      - name: Run requested checks
        shell: bash
        run: ${{ inputs.command }}
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.run_id }}
          path: |
            coverage.xml
            coverage-html/
            junit.xml
          if-no-files-found: ignore
          retention-days: 14
