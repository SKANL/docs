name: Reusable Python setup

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
    outputs:
      python-version:
        value: '3.11'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.7.0
        with:
          version: '0.12.14'
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run python -V && uv --version
      - name: Run requested checks
        shell: bash
        run: ${{ inputs.command }}
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}
          path: |
            coverage.xml
            coverage-html/
            junit.xml
          if-no-files-found: ignore
          retention-days: 14
