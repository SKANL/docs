name: Security

on:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v3.28.17
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v3.28.17
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  workflow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Reject mutable actions and unsafe triggers
        shell: bash
        run: |
          files=$(find .github/workflows -maxdepth 1 -name '*.yml' ! -name security.yml -print)
          if grep -nE 'uses: [^#]+@(main|master|latest|v[0-9]+)$' $files; then exit 1; fi
          if grep -nE 'doctor.*\|\| *true' $files; then exit 1; fi
