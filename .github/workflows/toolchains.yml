name: Toolchains

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchains-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install pinned system toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc=3.1.11+dfsg-1 libreoffice-writer default-jre-headless poppler-utils
          npm install --global @mermaid-js/mermaid-cli@11.4.2
          curl --fail --location --silent --show-error -o /tmp/resvg.tar.gz https://github.com/linebender/resvg/releases/download/v0.45.1/resvg-linux-x86_64.tar.gz
          echo '3c1d52850a78bc4ed0e9d05605b53ad21bb5313184f14bf72515d29cb98cda10  /tmp/resvg.tar.gz' | sha256sum --check
          sudo tar -xzf /tmp/resvg.tar.gz -C /usr/local/bin resvg
          sudo chmod +x /usr/local/bin/resvg
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.7.0
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv sync --locked
      - name: Record toolchain manifest
        run: |
          mkdir -p artifacts
          { python --version; uv --version; pandoc --version | head -1; soffice --version; pdftoppm -v 2>&1 | head -1; mmdc --version; resvg --version; node --version; } > artifacts/toolchain-manifest.txt
      - run: uv run pytest tests/unit tests/integration -q -rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: toolchain-manifest-${{ github.run_id }}
          path: artifacts/toolchain-manifest.txt
          if-no-files-found: error
          retention-days: 14
