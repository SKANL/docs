[package]
name = "docs-desktop"
version = "0.1.0"
description = "Windows-first desktop shell for Review Studio"
authors = ["Docs project"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "docs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
